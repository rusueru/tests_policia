<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tests Policía Local</title><link rel="stylesheet" href="css/styles.css">
</head>
<body><main class="shell">
<header class="hero"><p class="eyebrow">POLICÍA LOCAL · COMUNITAT VALENCIANA</p><h1>Tests de estudio</h1>
<p class="hero-copy">Selecciona un tema para practicar. Las preguntas falladas vuelven al final de la cola hasta que se aciertan.</p></header>
<section class="topic-grid" id="topic-grid"></section></main>
<script>
const temas = Array.from({ length: 40 }, (_, i) => i + 1);

const nombres = {
  5: "El Poder Judicial · El Tribunal Constitucional",
  12: "Del homicidio y sus formas · De las lesiones · Delitos contra la libertad · Torturas e integridad moral"
};

const grid = document.getElementById("topic-grid");

temas.forEach(numero => {
  const nn = String(numero).padStart(2, "0");
  const disponible = Object.prototype.hasOwnProperty.call(nombres, numero);
  const nombre = nombres[numero] || `Tema ${numero}`;

  const card = document.createElement("article");
  card.className = disponible ? "topic-card" : "topic-card disabled-card";

  if (disponible) {
    card.innerHTML = `
      <div class="topic-number">Tema ${numero}</div>
      <h2>${nombre}</h2>
      <a class="primary-link" href="temas/tema${nn}/index.html">Entrar al Tema ${numero}</a>
    `;
  } else {
    card.innerHTML = `
      <div class="topic-number">Tema ${numero}</div>
      <h2>${nombre}</h2>
      <p>Pendiente de añadir</p>
    `;
  }

  grid.appendChild(card);
});
</script></body></html>
